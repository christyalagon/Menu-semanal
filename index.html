<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi menú">
  <meta name="description" content="Menú semanal y compra inteligente, disponible sin conexión.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=4">
  <title>Mi menú · Compra semanal</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark">M<span>·</span></div>
      <div class="brand-copy"><span>ORGANIZA TU SEMANA</span><strong>Mi menú</strong></div>
      <div class="top-actions">
        <button class="icon-button refresh-button" id="refresh-button" aria-label="Descargar últimas actualizaciones" title="Actualizar aplicación">↻</button>
        <button class="icon-button" id="settings-button" aria-label="Ajustes y copia de seguridad" title="Ajustes">⚙</button>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Secciones">
      <button data-tab="week" class="nav-item active"><span aria-hidden="true">▦</span><small>Menú</small></button>
      <button data-tab="shop" class="nav-item"><span aria-hidden="true">◉</span><small>Compra</small></button>
      <button data-tab="pantry" class="nav-item"><span aria-hidden="true">▤</span><small>Despensa</small></button>
    </nav>
  </div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=4"></script>
</body>
</html>
